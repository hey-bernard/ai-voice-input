<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:" />
  <title>받아쓰기</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { background: transparent; }
    body { padding: 8px; height: 100vh; }
    .panel {
      height: 100%; display: flex; flex-direction: column;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px;
      border-bottom: 1px solid var(--border); -webkit-app-region: drag;
    }
    header button, header select { -webkit-app-region: no-drag; }
    .status {
      display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px;
      padding: 3px 10px; border-radius: 999px; background: var(--bg-sunk); color: var(--fg-muted);
    }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .status[data-state="recording"] { background: var(--rec-soft); color: var(--rec); }
    .status[data-state="recording"] .dot { animation: pulse 1.2s ease-in-out infinite; }
    .status[data-state="processing"] { background: var(--accent-soft); color: var(--accent); }
    .status[data-state="paused"] { background: var(--warn-soft); color: var(--warn); }
    .status[data-state="error"] { background: var(--err-soft); color: var(--err); }
    @keyframes pulse { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) { .status .dot { animation: none !important; } }
    .elapsed { font-variant-numeric: tabular-nums; color: var(--fg-muted); font-size: 13px; }
    .meter { flex: 1; height: 6px; border-radius: 3px; background: var(--bg-sunk); overflow: hidden; min-width: 40px; }
    .meter > div { height: 100%; width: 0; background: var(--fg-muted); transition: width 60ms linear; }
    .meter.speaking > div { background: var(--rec); }

    .tones { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
    .tone {
      border: 1px solid var(--border); background: var(--bg-elev); border-radius: 999px;
      padding: 3px 12px; cursor: pointer; font-size: 13px;
    }
    .tone[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
    .tones .spacer { flex: 1; }

    .messages:empty { display: none; }
    .messages { padding: 8px 14px 0; display: flex; flex-direction: column; gap: 6px; }
    .msg { padding: 8px 10px; border-radius: 8px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
    .msg.warn { background: var(--warn-soft); color: var(--warn); }
    .msg.error { background: var(--err-soft); color: var(--err); }
    .msg.ok { background: var(--ok-soft); color: var(--ok); }
    .msg.info { background: var(--accent-soft); color: var(--fg); }
    .msg .text { flex: 1; }
    .msg .actions { display: flex; gap: 6px; flex-wrap: wrap; }

    main { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
    .empty { margin: auto; text-align: center; color: var(--fg-muted); max-width: 320px; }
    .empty strong { color: var(--fg); display: block; font-size: 15px; margin-bottom: 4px; }

    .bundle { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev); padding: 8px 10px; }
    .bundle.excluded { opacity: 0.5; }
    .bundle.inserted { opacity: 0.6; }
    .bundle .top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-muted); }
    .bundle .top label { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); font-weight: 600; }
    .bundle .badge { padding: 0 6px; border-radius: 4px; background: var(--bg-sunk); }
    .bundle .badge.err { background: var(--err-soft); color: var(--err); }
    .bundle .badge.warn { background: var(--warn-soft); color: var(--warn); }
    .bundle .badge.ok { background: var(--ok-soft); color: var(--ok); }
    .bundle .badge.busy { background: var(--accent-soft); color: var(--accent); }
    .bundle .top .grow { flex: 1; }
    .bundle textarea {
      width: 100%; margin-top: 6px; min-height: 44px; resize: vertical;
      border: 1px solid transparent; border-radius: 8px; background: var(--bg); padding: 6px 8px;
    }
    .bundle textarea:hover { border-color: var(--border); }
    .bundle textarea:focus { border-color: var(--focus); outline: none; }
    .bundle .placeholder { margin-top: 6px; padding: 6px 8px; color: var(--fg-muted); font-style: italic; }
    .bundle .raw { margin-top: 4px; font-size: 12px; color: var(--fg-muted); padding: 4px 8px; border-left: 2px solid var(--border); }
    .bundle .row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
    .bundle .row select { font-size: 12px; min-height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); }

    footer { border-top: 1px solid var(--border); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
    footer .controls { display: flex; gap: 8px; }
    footer .controls .grow { flex: 1; }
    footer .hints { font-size: 11px; color: var(--fg-muted); display: flex; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="panel" role="application" aria-label="AI 음성 받아쓰기">
    <header>
      <span id="status" class="status" data-state="idle" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="statusText">대기 중</span></span>
      <span id="elapsed" class="elapsed" aria-label="경과 시간">00:00</span>
      <div id="meter" class="meter" aria-hidden="true"><div></div></div>
      <button id="btnSettings" class="btn icon ghost" title="설정" aria-label="설정 열기">⚙</button>
      <button id="btnHide" class="btn icon ghost" title="창 숨기기 (Esc)" aria-label="창 숨기기">✕</button>
    </header>

    <div class="tones" role="radiogroup" aria-label="말투 선택" id="tones"></div>

    <div class="messages" id="messages" aria-live="assertive"></div>

    <main id="list" aria-label="문장 묶음 목록"></main>

    <footer>
      <div class="controls">
        <button id="btnRecord" class="btn">● 받아쓰기 시작</button>
        <button id="btnStop" class="btn" disabled>■ 종료</button>
        <span class="grow"></span>
        <button id="btnCopy" class="btn" disabled>복사</button>
        <button id="btnInsert" class="btn primary" disabled>삽입</button>
      </div>
      <div class="hints" id="hints"></div>
    </footer>
  </div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <script src="segmenter.js"></script>
  <script src="recorder.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
